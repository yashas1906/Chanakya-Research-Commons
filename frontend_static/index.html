<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chanakya Research Commons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = "http://localhost:8000/api";

    function App() {
      const [activeTab, setActiveTab] = useState("search");
      const [users, setUsers] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);

      const [query, setQuery] = useState("graph neural networks");
      const [searchResults, setSearchResults] = useState(null);
      const [searching, setSearching] = useState(false);

      const [feed, setFeed] = useState([]);
      const [newTitle, setNewTitle] = useState("");
      const [newBody, setNewBody] = useState("");
      const [newTags, setNewTags] = useState("data mining, graph neural networks");

      const [personalLib, setPersonalLib] = useState([]);
      const [univLib, setUnivLib] = useState([]);
      const [recs, setRecs] = useState(null);
      const [alsoSaved, setAlsoSaved] = useState([]);
      const [selectedPaperTitle, setSelectedPaperTitle] = useState("");

      const [question, setQuestion] = useState("What are the key applications and challenges of graph neural networks?");
      const [libraryOnly, setLibraryOnly] = useState(false);
      const [ragResponse, setRagResponse] = useState(null);
      const [asking, setAsking] = useState(false);

      const [trendsData, setTrendsData] = useState(null);
      const [analyticsData, setAnalyticsData] = useState(null);
      const [deptFilter, setDeptFilter] = useState("");

      useEffect(() => {
        fetch(`${API}/users?limit=60`)
          .then((r) => r.json())
          .then((data) => {
            const clean = data.filter((u) => !u.is_flagged_spam);
            setUsers(clean);
            if (clean.length > 0) setCurrentUser(clean[0]);
          });
        runSearch("graph neural networks");
      }, []);

      useEffect(() => {
        if (!currentUser) return;
        fetch(`${API}/feed?user_id=${currentUser.user_id}`).then((r) => r.json()).then(setFeed);
        fetch(`${API}/library?user_id=${currentUser.user_id}`).then((r) => r.json()).then(setPersonalLib);
        fetch(`${API}/library`).then((r) => r.json()).then(setUnivLib);
        fetch(`${API}/recommendations/${currentUser.user_id}`).then((r) => r.json()).then(setRecs);
      }, [currentUser]);

      const runSearch = async (qStr) => {
        if (!qStr.trim()) return;
        setSearching(true);
        try {
          const res = await fetch(`${API}/search?q=${encodeURIComponent(qStr)}`);
          setSearchResults(await res.json());
        } finally {
          setSearching(false);
        }
      };

      const handleSavePaper = async (paperId) => {
        if (!currentUser) return;
        await fetch(`${API}/library/save`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: currentUser.user_id, paper_id: paperId, private_notes: "Saved from Unified Search" }),
        });
        fetch(`${API}/library?user_id=${currentUser.user_id}`).then((r) => r.json()).then(setPersonalLib);
        fetch(`${API}/library`).then((r) => r.json()).then(setUnivLib);
        runSearch(query);
      };

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!currentUser || !newTitle.trim()) return;
        await fetch(`${API}/posts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            author_id: currentUser.user_id,
            title: newTitle,
            body: newBody,
            tags: newTags.split(",").map((t) => t.trim()).filter(Boolean),
          }),
        });
        setNewTitle("");
        setNewBody("");
        fetch(`${API}/feed?user_id=${currentUser.user_id}`).then((r) => r.json()).then(setFeed);
      };

      const loadAlsoSaved = async (paperId, title) => {
        setSelectedPaperTitle(title);
        const res = await fetch(`${API}/papers/${paperId}/also-saved`);
        setAlsoSaved(await res.json());
      };

      const handleAskAssistant = async (e) => {
        e.preventDefault();
        if (!question.trim()) return;
        setAsking(true);
        try {
          const res = await fetch(`${API}/assistant/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, library_only: libraryOnly }),
          });
          setRagResponse(await res.json());
        } finally {
          setAsking(false);
        }
      };

      const loadAdminViews = async (dept = "") => {
        const [tRes, aRes] = await Promise.all([
          fetch(`${API}/trends-and-anomalies`),
          fetch(`${API}/analytics/overview${dept ? `?department=${encodeURIComponent(dept)}` : ""}`),
        ]);
        setTrendsData(await tRes.json());
        setAnalyticsData(await aRes.json());
      };

      return (
        <div className="min-h-screen">
          <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-10 backdrop-blur">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-lg font-bold text-indigo-400">Chanakya Research Commons</h1>
                <p className="text-xs text-slate-400">School of Engineering • Data Mining & Warehousing Platform</p>
              </div>
              <nav className="flex flex-wrap gap-1.5">
                {[
                  { id: "search", label: "F5 Unified Search" },
                  { id: "feed", label: "F2 Feed & Posts" },
                  { id: "library", label: "F3/F6 Library & Recs" },
                  { id: "assistant", label: "F8 Research Assistant" },
                  { id: "analytics", label: "F7/F9 Trends & Admin" },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => {
                      setActiveTab(t.id);
                      if (t.id === "analytics") loadAdminViews(deptFilter);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                      activeTab === t.id ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-400">Acting as:</span>
                <select
                  className="bg-slate-800 border border-slate-700 rounded-md px-2 py-1 text-slate-200"
                  value={currentUser?.user_id || ""}
                  onChange={(e) => setCurrentUser(users.find((u) => u.user_id === e.target.value))}
                >
                  {users.map((u) => (
                    <option key={u.user_id} value={u.user_id}>
                      {u.full_name} • {u.role} ({u.department})
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {activeTab === "search" && (
              <div className="space-y-6">
                <form onSubmit={(e) => { e.preventDefault(); runSearch(query); }} className="flex gap-2">
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Search any research topic..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500"
                  />
                  <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-lg text-sm font-medium">
                    {searching ? "Searching..." : "Unified Search"}
                  </button>
                </form>

                {searchResults && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <h2 className="text-sm font-semibold text-sky-400">1. External Scholarly Sources ({searchResults.panels.external_sources.length})</h2>
                      {searchResults.panels.external_sources.map((p) => (
                        <div key={p.paper_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800/80 space-y-1.5">
                          <div className="font-medium text-sm text-slate-100">{p.canonical_title}</div>
                          <div className="text-xs text-slate-400">
                            {p.publication_year} • {p.venue} • RRF: {p.rrf_score?.toFixed(4)}
                          </div>
                          <button onClick={() => handleSavePaper(p.paper_id)} className="text-xs bg-slate-800 hover:bg-indigo-600 px-2.5 py-1 rounded text-indigo-300 hover:text-white">
                            + Save to Chanakya Library
                          </button>
                        </div>
                      ))}
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <h2 className="text-sm font-semibold text-emerald-400">2. Already in Chanakya Library ({searchResults.panels.chanakya_library.length})</h2>
                      {searchResults.panels.chanakya_library.map((p) => (
                        <div key={p.paper_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800/80 space-y-1">
                          <div className="font-medium text-sm text-slate-100">{p.canonical_title}</div>
                          <div className="text-xs text-emerald-400">
                            Saved by {p.save_count} Chanakya member(s) • {p.publication_year} • PageRank: {p.pagerank_score?.toFixed(5)}
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <h2 className="text-sm font-semibold text-amber-400">3. University Researchers & Peers ({searchResults.panels.people.length})</h2>
                      {searchResults.panels.people.map((u) => (
                        <div key={u.user_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800/80">
                          <div className="flex justify-between text-sm font-medium">
                            <span>{u.full_name} ({u.role})</span>
                            <span className="text-xs text-amber-400">{(u.similarity * 100).toFixed(1)}% match</span>
                          </div>
                          <div className="text-xs text-slate-400">{u.department} • Tags: {u.interest_tags?.join(", ")}</div>
                        </div>
                      ))}
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <h2 className="text-sm font-semibold text-purple-400">4. Related Posts & Discussions ({searchResults.panels.posts.length})</h2>
                      {searchResults.panels.posts.map((pt) => (
                        <div key={pt.post_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800/80 space-y-1">
                          <div className="font-medium text-sm text-slate-100">{pt.title}</div>
                          <div className="text-xs text-slate-400">By {pt.author_name} ({pt.department}) • {pt.upvote_count} upvotes</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === "feed" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <form onSubmit={handleCreatePost} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 h-fit">
                  <h2 className="text-sm font-semibold text-indigo-400">Start a Research Discussion</h2>
                  <input type="text" placeholder="Discussion title..." value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
                  <textarea rows="4" placeholder="Share an idea, question, or paper takeaway..." value={newBody} onChange={(e) => setNewBody(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></textarea>
                  <input type="text" placeholder="Comma-separated tags" value={newTags} onChange={(e) => setNewTags(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs" />
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg text-sm font-medium">Publish Post</button>
                </form>

                <div className="lg:col-span-2 space-y-3">
                  <h2 className="text-sm font-semibold text-slate-300">Personalized Research Feed (Follows + Semantic Match)</h2>
                  {feed.map((post) => (
                    <div key={post.post_id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                      <div className="flex justify-between items-start">
                        <h3 className="font-semibold text-slate-100">{post.title}</h3>
                        <span className="text-xs bg-slate-800 px-2 py-0.5 rounded text-indigo-300">▲ {post.upvote_count}</span>
                      </div>
                      <p className="text-sm text-slate-300">{post.body}</p>
                      {post.attached_paper_title && (
                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded text-sky-300">
                          Attached: {post.attached_paper_title}
                        </div>
                      )}
                      <div className="text-xs text-slate-400">{post.author_name} • {post.author_dept} • Tags: {post.tags?.join(", ")}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === "library" && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 className="text-sm font-semibold text-indigo-400">Recommended Papers for You (F6 Content-Based)</h2>
                    {recs?.recommended_papers?.map((p) => (
                      <div key={p.paper_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800 flex justify-between items-center gap-2">
                        <div>
                          <div className="text-sm font-medium">{p.canonical_title}</div>
                          <div className="text-xs text-slate-400">{(p.match_score * 100).toFixed(1)}% match • {p.publication_year}</div>
                        </div>
                        <button onClick={() => handleSavePaper(p.paper_id)} className="text-xs bg-indigo-600 px-2.5 py-1 rounded shrink-0">Save</button>
                      </div>
                    ))}
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 className="text-sm font-semibold text-amber-400">Recommended Collaborators (F6)</h2>
                    {recs?.recommended_people?.map((u) => (
                      <div key={u.user_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                        <div className="text-sm font-medium">{u.full_name} ({u.role}) — {(u.match_score * 100).toFixed(1)}% match</div>
                        <div className="text-xs text-slate-400">{u.department} • {u.interest_tags?.join(", ")}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 className="text-sm font-semibold text-emerald-400">Your Personal Saved Library ({personalLib.length})</h2>
                    {personalLib.map((p) => (
                      <div key={p.paper_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-1">
                        <div className="text-sm font-medium">{p.canonical_title}</div>
                        <div className="text-xs text-slate-400">Note: {p.private_notes}</div>
                        <button onClick={() => loadAlsoSaved(p.paper_id, p.canonical_title)} className="text-xs text-indigo-400 underline">
                          View "Members who saved this also saved..." (FP-Growth)
                        </button>
                      </div>
                    ))}
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 className="text-sm font-semibold text-purple-400">
                      {selectedPaperTitle ? `Also Saved Alongside "${selectedPaperTitle.slice(0, 40)}..."` : "Top Saved in Chanakya Library"}
                    </h2>
                    {(selectedPaperTitle ? alsoSaved : univLib.slice(0, 8)).map((p) => (
                      <div key={p.paper_id} className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                        <div className="text-sm font-medium">{p.canonical_title}</div>
                        <div className="text-xs text-slate-400">{p.publication_year} • Saved {p.save_count} times</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === "assistant" && (
              <div className="max-w-4xl mx-auto space-y-4">
                <form onSubmit={handleAskAssistant} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <h2 className="text-sm font-semibold text-indigo-400">F8 Grounded Research Assistant (RAG + Local Ollama)</h2>
                  <textarea rows="3" value={question} onChange={(e) => setQuestion(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm"></textarea>
                  <div className="flex items-center justify-between">
                    <label className="flex items-center gap-2 text-xs text-slate-300">
                      <input type="checkbox" checked={libraryOnly} onChange={(e) => setLibraryOnly(e.target.checked)} />
                      Restrict answers to Chanakya Shared Library items only
                    </label>
                    <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium">
                      {asking ? "Retrieving & Generating..." : "Ask with Citations"}
                    </button>
                  </div>
                </form>

                {ragResponse && (
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                    <div>
                      <h3 className="text-xs uppercase tracking-wider text-indigo-400 font-semibold mb-1">Synthesized Answer</h3>
                      <p className="text-sm text-slate-100 whitespace-pre-line leading-relaxed">{ragResponse.answer}</p>
                    </div>
                    <div className="space-y-2 border-t border-slate-800 pt-3">
                      <h3 className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Retrieved Evidence Passages</h3>
                      {ragResponse.citations?.map((c) => (
                        <div key={c.ref_index} className="p-3 bg-slate-950 rounded-lg border border-slate-800 text-xs space-y-1">
                          <div className="font-semibold text-sky-400">
                            [{c.ref_index}] {c.title} ({c.year}) — {(c.similarity * 100).toFixed(1)}% similarity
                          </div>
                          <p className="text-slate-300">{c.passage}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === "analytics" && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 className="text-sm font-semibold text-rose-400">F7 Sliding-Window Topic Spike Alerts (7d vs 30d Baseline)</h2>
                    <table className="w-full text-xs text-left">
                      <thead className="text-slate-400 border-b border-slate-800">
                        <tr><th className="py-1.5">Topic</th><th>Last 7d</th><th>Weekly Avg</th><th>Spike Ratio</th></tr>
                      </thead>
                      <tbody>
                        {trendsData?.trending_topics?.map((t) => (
                          <tr key={t.topic} className="border-b border-slate-800/50">
                            <td className="py-1.5 font-medium">{t.topic}</td>
                            <td>{t.recent_7d}</td>
                            <td>{t.baseline_weekly_avg}</td>
                            <td className="text-rose-400 font-semibold">+{t.spike_ratio}x</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h2 className="text-sm font-semibold text-amber-400">F7 Isolation Forest Anomaly / Spam Flags</h2>
                    <table className="w-full text-xs text-left">
                      <thead className="text-slate-400 border-b border-slate-800">
                        <tr><th className="py-1.5">Member</th><th>Department</th><th>Posts</th><th>Anomaly Score</th></tr>
                      </thead>
                      <tbody>
                        {trendsData?.flagged_spam_accounts?.map((u) => (
                          <tr key={u.user_id} className="border-b border-slate-800/50">
                            <td className="py-1.5 font-medium text-amber-300">{u.full_name}</td>
                            <td>{u.department}</td>
                            <td>{u.post_count}</td>
                            <td>{u.anomaly_score}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h2 className="text-sm font-semibold text-indigo-400">F9 Institutional Star Schema Analytics (University → Department → Topic)</h2>
                    <select
                      value={deptFilter}
                      onChange={(e) => { setDeptFilter(e.target.value); loadAdminViews(e.target.value); }}
                      className="bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs"
                    >
                      <option value="">All Departments (University Roll-Up)</option>
                      <option value="Computer Science & AI">Computer Science & AI</option>
                      <option value="Electronics & Communication">Electronics & Communication</option>
                      <option value="Biotechnology">Biotechnology</option>
                      <option value="Management & Commerce">Management & Commerce</option>
                      <option value="School of Law">School of Law</option>
                      <option value="Liberal Arts & Humanities">Liberal Arts & Humanities</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div>
                      <h3 className="text-xs font-semibold text-slate-400 mb-2">Topic Activity Breakdown (dw.fact_research_activity)</h3>
                      <table className="w-full text-xs text-left">
                        <thead className="text-slate-400 border-b border-slate-800">
                          <tr><th className="py-1">Department</th><th>Cluster</th><th>Topic</th><th>Saves</th><th>Views</th></tr>
                        </thead>
                        <tbody>
                          {analyticsData?.topic_breakdown?.slice(0, 12).map((row, idx) => (
                            <tr key={idx} className="border-b border-slate-800/50">
                              <td className="py-1">{row.department}</td>
                              <td className="text-slate-400">{row.parent_cluster?.split(":")[0]}</td>
                              <td className="font-medium">{row.topic_name}</td>
                              <td>{row.total_saves}</td>
                              <td>{row.total_views}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div>
                      <h3 className="text-xs font-semibold text-slate-400 mb-2">Cross-Department Collaboration (dw.fact_dept_collaboration)</h3>
                      <table className="w-full text-xs text-left">
                        <thead className="text-slate-400 border-b border-slate-800">
                          <tr><th className="py-1">Source Dept</th><th>Target Dept</th><th>Interactions</th></tr>
                        </thead>
                        <tbody>
                          {analyticsData?.cross_dept_collaboration?.slice(0, 12).map((row, idx) => (
                            <tr key={idx} className="border-b border-slate-800/50">
                              <td className="py-1">{row.source_department}</td>
                              <td>{row.target_department}</td>
                              <td className="text-emerald-400 font-semibold">{row.interactions}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
