services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chanakya_commons}
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crc_admin} -d ${POSTGRES_DB:-chanakya_commons}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: crc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: crc_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crc_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crc_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-chanakya_commons}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      CRC_AUTH_SECRET: ${CRC_AUTH_SECRET:?Set CRC_AUTH_SECRET in .env}
      CRC_DEMO_PASSCODE: ${CRC_DEMO_PASSCODE:?Set CRC_DEMO_PASSCODE in .env}
      CRC_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crc_frontend
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crc_pipeline
    working_dir: /app
    entrypoint: ["python", "-m"]
    command: ["data_pipeline.seed_database", "--seed", "42"]
    volumes:
      - ./data_pipeline:/app/data_pipeline:ro
      - ./evaluation:/app/evaluation
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crc_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-chanakya_commons}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      CRC_DEMO_PASSCODE: ${CRC_DEMO_PASSCODE:?Set CRC_DEMO_PASSCODE in .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    profiles:
      - pipeline

  # F4 scheduled refresh: incremental ingestion (OpenAlex, arXiv, RSS) + warehouse ELT every 6 hours.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crc_scheduler
    working_dir: /app
    entrypoint: ["python", "data_pipeline/scheduler.py"]
    command: ["--interval-hours", "6"]
    volumes:
      - ./data_pipeline:/app/data_pipeline:ro
      - ./evaluation:/app/evaluation
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crc_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-chanakya_commons}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    profiles:
      - scheduler

volumes:
  pg_data:
  minio_data:
  ollama_data:
